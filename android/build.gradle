apply plugin: 'com.android.library'

def DEFAULT_COMPILE_SDK_VERSION = 34
def DEFAULT_MIN_SDK_VERSION = 21
def DEFAULT_TARGET_SDK_VERSION = 34

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
    }
}

android {
    compileSdk safeExtGet('compileSdkVersion', DEFAULT_COMPILE_SDK_VERSION)
    defaultConfig {
        minSdk safeExtGet('minSdkVersion', DEFAULT_MIN_SDK_VERSION)
        targetSdk safeExtGet('targetSdkVersion', DEFAULT_TARGET_SDK_VERSION)
        versionCode 1
        versionName '1.0'
    }
    lint {
        abortOnError false
    }
}

repositories {
    maven {
        url "$rootDir/../node_modules/react-native/android"
    }
    google()
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation fileTree(dir: 'libs', includes: ['*.jar'])
    implementation project(path: ':vpnLib')
}
